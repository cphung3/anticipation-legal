<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTicipation · Legal</title>
<meta name="description" content="Privacy policy and account-deletion instructions for ANTicipation — countdown to joy.">
<link rel="canonical" href="https://cphung3.github.io/anticipation-legal/">
<meta property="og:type" content="website">
<meta property="og:title" content="ANTicipation · Legal">
<meta property="og:description" content="Privacy policy and account-deletion instructions for ANTicipation — countdown to joy.">
<meta property="og:image" content="https://cphung3.github.io/anticipation-legal/og-image.png">
<meta property="og:url" content="https://cphung3.github.io/anticipation-legal/">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#f7f1e7; --surface:#fffdf9; --text:#2e2a24; --muted:#6b6153;
    --brand:#3b6b4a; --accent:#c4703f; --border:#e4d9c8; --shadow:rgba(94,74,48,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a16; --surface:#26231d; --text:#efe7d8; --muted:#a89c88;
      --brand:#7fb98e; --accent:#e0925f; --border:#3a352c; --shadow:rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{max-width:560px; width:100%; text-align:center}
  .dot{width:64px;height:64px;border-radius:18px;background:var(--brand);margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:30px;
    box-shadow:0 8px 24px var(--shadow)}
  h1{font-size:2.1rem; margin:.1em 0 .1em; letter-spacing:-.5px}
  .tag{color:var(--muted); margin:0 0 2em}
  .links{display:grid; gap:14px}
  a.card{display:block; text-decoration:none; text-align:left; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px 22px; box-shadow:0 4px 18px var(--shadow); transition:transform .12s ease, border-color .12s ease}
  a.card:hover{transform:translateY(-2px); border-color:var(--brand)}
  a.card .t{font-weight:800; font-size:1.1rem; color:var(--brand)}
  a.card .d{color:var(--muted); font-size:.95rem; margin-top:2px}
  footer{margin-top:2.5em; color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
  <main class="wrap">
    <div class="dot" aria-hidden="true">A</div>
    <h1>ANTicipation</h1>
    <p class="tag">countdown to joy</p>
    <div class="links">
      <a class="card" href="privacy/">
        <div class="t">Privacy policy →</div>
        <div class="d">Everything stays on your phone. No tracking, no ads, nothing sold.</div>
      </a>
      <a class="card" href="delete-account/">
        <div class="t">Delete your account →</div>
        <div class="d">Remove your account and all its data — in the app or by request.</div>
      </a>
    </div>
    <footer>ANTicipation is an iOS &amp; Android app.</footer>
  </main>
</body>
</html>
